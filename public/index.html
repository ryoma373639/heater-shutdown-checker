<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="灯油ストーブの消火確認を管理するアプリケーション">
  <meta name="theme-color" content="#ef4444">
  <title>灯油ストーブ消火確認アプリ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">

  <!-- Authentication -->
  <script src="./auth.js"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="./firebase-config.js"></script>

  <style>
    /* ============================================
       CSS Variables - Modern Color Palette
       ============================================ */
    :root {
      --primary-red: #f43f5e;
      --primary-red-dark: #e11d48;
      --primary-red-light: #fb7185;
      --accent-orange: #fb923c;
      --accent-yellow: #fbbf24;
      --success-green: #10b981;
      --success-green-dark: #059669;
      --info-blue: #3b82f6;
      --info-blue-light: #60a5fa;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;

      --bg-gradient-start: #fff1f2;
      --bg-gradient-end: #ffe4e6;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);

      --transition-fast: 150ms ease-in-out;
      --transition-normal: 300ms ease-in-out;
      --transition-slow: 500ms ease-in-out;
    }

    /* ============================================
       Reset & Base Styles
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      padding: 16px;
      color: var(--gray-800);
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* ============================================
       Glassmorphism Cards
       ============================================ */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      padding: 20px;
      margin-bottom: 20px;
      transition: all var(--transition-normal);
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    /* ============================================
       Header Section
       ============================================ */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .icon-box {
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--primary-red-dark) 100%);
      padding: 14px;
      border-radius: 12px;
      font-size: 24px;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3); }
      50% { box-shadow: 0 4px 20px rgba(244, 63, 94, 0.5); }
    }

    h1 {
      font-size: 22px;
      color: var(--gray-900);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--gray-500);
      font-weight: 500;
    }

    .info-box {
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
      border-left: 4px solid var(--info-blue);
      padding: 14px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.6;
    }

    /* ============================================
       Modern Tabs with Animations
       ============================================ */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      position: relative;
    }

    .tab {
      padding: 14px 20px;
      border: none;
      border-radius: 12px 12px 0 0;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      color: var(--gray-600);
      flex: 1;
      min-width: 90px;
      text-align: center;
      transition: all var(--transition-normal);
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .tab::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left var(--transition-slow);
    }

    .tab:hover::before {
      left: 100%;
    }

    .tab:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .tab.active {
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--primary-red-dark) 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
      transform: translateY(-2px) scale(1.02);
      border-color: var(--primary-red-light);
    }

    /* ============================================
       Form Inputs
       ============================================ */
    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid var(--gray-200);
      border-radius: 10px;
      font-size: 16px;
      transition: all var(--transition-fast);
      background: rgba(255, 255, 255, 0.9);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--info-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      transform: translateY(-1px);
    }

    /* 社員の追加フィールド - ブルー */
    #employeeNumberInput:focus,
    #employeeNameInput:focus {
      outline: none;
      border-color: var(--info-blue) !important;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15) !important;
      transform: translateY(-1px);
    }

    /* ============================================
       Buttons with Micro-interactions
       ============================================ */
    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: all var(--transition-fast);
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width var(--transition-normal), height var(--transition-normal);
    }

    .btn:active::after {
      width: 300px;
      height: 300px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* シャイン効果 - 追加ボタン（ブルー） */
    .btn-primary {
      background: linear-gradient(135deg, var(--info-blue) 0%, var(--info-blue-light) 100%);
      color: white;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.5), transparent);
      transition: left var(--transition-slow);
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:hover {
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
    }

    /* シャイン効果 - 再使用ボタン（イエロー/オレンジ） */
    .btn-yellow {
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-orange) 100%);
      color: white;
      padding: 14px 24px;
    }

    .btn-yellow::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(252, 211, 77, 0.6), transparent);
      transition: left var(--transition-slow);
    }

    .btn-yellow:hover::before {
      left: 100%;
    }

    .btn-yellow:hover {
      box-shadow: 0 6px 16px rgba(251, 191, 36, 0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success-green) 0%, var(--success-green-dark) 100%);
      color: white;
      font-size: 17px;
      padding: 18px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-success:hover {
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
    }

    .reuse-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .reuse-input {
      flex: 1;
      min-width: 130px;
      padding: 14px 16px;
      border: 2px solid var(--gray-200);
      border-radius: 10px;
      font-size: 16px;
      transition: all var(--transition-fast);
      background: rgba(255, 255, 255, 0.9);
    }

    .reuse-input:focus {
      outline: none;
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.1);
    }

    .reuse-number {
      width: 80px;
      padding: 14px 16px;
      border: 2px solid var(--gray-200);
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
      transition: all var(--transition-fast);
      background: rgba(255, 255, 255, 0.9);
    }

    .reuse-number:focus {
      outline: none;
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.1);
    }

    /* ============================================
       Progress Bar
       ============================================ */
    .progress-container {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
      overflow: hidden;
      margin: 12px 0;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--success-green) 0%, var(--info-blue) 100%);
      border-radius: 10px;
      transition: width var(--transition-slow);
      position: relative;
      overflow: hidden;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* ============================================
       Statistics Section
       ============================================ */
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stats h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--gray-900);
    }

    .stats-text {
      font-size: 14px;
      color: var(--gray-600);
      background: var(--gray-100);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* ============================================
       Employee List with Animations
       ============================================ */
    .employee-list {
      max-height: 450px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .employee-list::-webkit-scrollbar {
      width: 8px;
    }

    .employee-list::-webkit-scrollbar-track {
      background: var(--gray-100);
      border-radius: 10px;
    }

    .employee-list::-webkit-scrollbar-thumb {
      background: var(--gray-300);
      border-radius: 10px;
    }

    .employee-list::-webkit-scrollbar-thumb:hover {
      background: var(--gray-400);
    }

    .employee-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 14px;
      border: 2px solid var(--gray-200);
      border-radius: 10px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.6);
      transition: all var(--transition-fast);
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* 追加ボタンで登録された社員 - ブルー背景 */
    .employee-item.type-permanent {
      background: rgba(219, 234, 254, 0.4);
      border-color: rgba(96, 165, 250, 0.3);
    }

    .employee-item.type-permanent:hover {
      background: rgba(219, 234, 254, 0.6);
      border-color: rgba(96, 165, 250, 0.5);
      transform: translateX(4px);
      box-shadow: var(--shadow);
    }

    /* 再使用ボタンで登録された社員 - イエロー背景 */
    .employee-item.type-temporary {
      background: rgba(254, 243, 199, 0.4);
      border-color: rgba(251, 191, 36, 0.3);
    }

    .employee-item.type-temporary:hover {
      background: rgba(254, 243, 199, 0.6);
      border-color: rgba(251, 191, 36, 0.5);
      transform: translateX(4px);
      box-shadow: var(--shadow);
    }

    .employee-item:hover {
      border-color: var(--gray-300);
      background: rgba(255, 255, 255, 0.9);
      transform: translateX(4px);
      box-shadow: var(--shadow);
    }

    .employee-item.checked {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border-color: var(--success-green);
      animation: checkPulse 0.5s ease-out;
    }

    /* チェック済み + type別の背景色 */
    .employee-item.checked.type-permanent {
      background: linear-gradient(135deg, #dbeafe 0%, #dcfce7 100%);
      border-color: var(--success-green);
    }

    .employee-item.checked.type-temporary {
      background: linear-gradient(135deg, #fef3c7 0%, #dcfce7 100%);
      border-color: var(--success-green);
    }

    @keyframes checkPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    /* ============================================
       Custom Checkbox with Animation
       ============================================ */
    input[type="checkbox"] {
      width: 28px;
      height: 28px;
      cursor: pointer;
      flex-shrink: 0;
      appearance: none;
      border: 2px solid var(--gray-300);
      border-radius: 6px;
      position: relative;
      transition: all var(--transition-fast);
      background: white;
    }

    input[type="checkbox"]:hover {
      border-color: var(--success-green);
      transform: scale(1.1);
    }

    input[type="checkbox"]:checked {
      background: linear-gradient(135deg, var(--success-green) 0%, var(--success-green-dark) 100%);
      border-color: var(--success-green);
    }

    input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 16px;
      font-weight: bold;
      animation: checkmark 0.3s ease-out;
    }

    @keyframes checkmark {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-45deg); }
      50% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    }

    .employee-name {
      flex: 1;
      font-size: 16px;
      color: var(--gray-900);
      font-weight: 500;
      word-break: break-word;
      transition: all var(--transition-fast);
    }

    .employee-name.checked {
      color: var(--gray-400);
      text-decoration: line-through;
    }

    .btn-delete {
      padding: 10px 18px;
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      border: 2px solid transparent;
      color: var(--primary-red);
      cursor: pointer;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .btn-delete:hover {
      background: var(--primary-red);
      color: white;
      border-color: var(--primary-red-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
    }

    /* ============================================
       Modal with Fade Animation
       ============================================ */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      padding: 28px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-xl);
      animation: modalSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(-50px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .modal-icon {
      padding: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      font-size: 24px;
    }

    .modal-icon.warning {
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--primary-red-dark) 100%);
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
    }

    .modal-icon.success {
      background: linear-gradient(135deg, var(--success-green) 0%, var(--success-green-dark) 100%);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 700;
    }

    .modal-title.warning {
      color: var(--primary-red-dark);
    }

    .modal-title.success {
      color: var(--success-green-dark);
    }

    .unchecked-list {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      border: 2px solid var(--primary-red-light);
      border-radius: 10px;
      padding: 18px;
      margin: 18px 0;
      max-height: 220px;
      overflow-y: auto;
    }

    .unchecked-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #991b1b;
      font-weight: 500;
      margin-bottom: 10px;
      font-size: 15px;
      animation: slideIn 0.3s ease-out;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--primary-red);
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    .success-box {
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
      border: 2px solid var(--success-green);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      margin: 18px 0;
    }

    .success-emoji {
      font-size: 56px;
      margin-bottom: 12px;
      animation: bounce 0.6s ease-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-10px); }
      50% { transform: translateY(0); }
      75% { transform: translateY(-5px); }
    }

    .btn-modal {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      transition: all var(--transition-fast);
    }

    .btn-modal:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-modal.dark {
      background: linear-gradient(135deg, var(--gray-800) 0%, var(--gray-900) 100%);
      color: white;
    }

    .btn-modal.success {
      background: linear-gradient(135deg, var(--success-green) 0%, var(--success-green-dark) 100%);
      color: white;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--gray-900);
    }

    /* ============================================
       Responsive Design
       ============================================ */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }

      .reuse-group {
        flex-direction: column;
      }

      .reuse-number {
        width: 100%;
      }

      .reuse-input {
        width: 100%;
      }

      .btn-yellow {
        width: 100%;
        text-align: center;
      }

      .tab {
        padding: 12px 10px;
        font-size: 13px;
      }

      h1 {
        font-size: 19px;
      }

      .icon-box {
        font-size: 20px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="icon-box">🔥</div>
        <div style="flex: 1;"><h1>灯油ストーブ消火確認</h1><p class="subtitle">火器安全管理システム</p></div>
      </div>
      <div class="info-box">
        <p style="color: #1e40af;" id="resetTimeText"><strong>毎日AM5時に自動リセット</strong> されます。退社時に必ずチェックしてください。</p>
        <p style="color: #6b7280; font-size: 12px; margin-top: 8px;" id="resetInfo">最終リセット: 未実行</p>
        <p style="font-size: 11px; margin-top: 8px;" id="firebaseStatus">
          <span style="color: #f59e0b;">🔄 接続確認中...</span>
        </p>
      </div>
    </div>
    
    <div class="tabs">
      <button class="tab active" onclick="switchTab(0)">第一工場</button>
      <button class="tab" onclick="switchTab(1)">第二工場</button>
      <button class="tab" onclick="switchTab(2)">第三工場</button>
      <button class="tab" onclick="switchTab(3)">第四工場</button>
    </div>
    
    <div class="card">
      <div class="section-title">社員の追加</div>
      <div class="reuse-group">
        <input type="text" id="employeeNumberInput" class="reuse-number" placeholder="番号">
        <input type="text" id="employeeNameInput" class="reuse-input" placeholder="自分の名前を入力">
        <button class="btn btn-primary" onclick="addEmployee()">追加</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title">再使用</div>
      <div class="reuse-group">
        <input type="text" id="reuseNumberInput" class="reuse-number" placeholder="番号">
        <input type="text" id="reuseNameInput" class="reuse-input" placeholder="自分の名前を入力">
        <button class="btn btn-yellow" onclick="reuseEmployee()">再使用</button>
      </div>
    </div>
    <div class="card">
      <div class="stats"><h2 id="listTitle">消火確認リスト (0/0)</h2><span class="stats-text" id="uncheckedCount">未確認: 0名</span></div>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
      </div>
      <div class="employee-list" id="employeeList"></div>
    </div>
    <div class="card">
      <button class="btn btn-success" onclick="handleFinalCheck()">✓ 最終確認・完了</button>
    </div>
    <div class="card" style="background: #f3f4f6;">
      <div class="section-title" style="font-size: 14px; color: #6b7280;">🔧 デバッグ・テスト機能</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;">
        <button class="btn btn-primary" style="flex: 1; min-width: 140px; font-size: 13px;" onclick="testFirebaseSync()">🔄 同期テスト</button>
        <button class="btn" style="flex: 1; min-width: 140px; background: #6b7280; color: white; font-size: 13px;" onclick="showDebugInfo()">🐛 接続情報</button>
        <button class="btn" style="flex: 1; min-width: 140px; background: #f59e0b; color: white; font-size: 13px;" onclick="debugEmployeeTypes()">🔍 社員TYPE確認</button>
        <button class="btn" style="flex: 1; min-width: 140px; background: #ef4444; color: white; font-size: 13px;" onclick="testResetFunction()">🧪 リセットテスト</button>
      </div>
    </div>
  </div>
  <div class="modal" id="warningModal"><div class="modal-content" id="modalContent"></div></div>

<script>
var factoryNames = ['第一工場', '第二工場', '第三工場', '第四工場'];
var allEmployees = {};
var currentTab = 0;

function init() {
  // Firebaseを初期化（存在する場合のみ）
  var firebaseInitialized = false;
  if (typeof initFirebase === 'function') {
    try {
      firebaseInitialized = initFirebase();
      updateFirebaseStatus(firebaseInitialized);
    } catch (e) {
      console.warn('Firebase初期化をスキップ:', e);
      updateFirebaseStatus(false);
    }
  } else {
    updateFirebaseStatus(false);
  }

  loadData();
  checkAndResetDaily();
  renderEmployeeList();
  updateResetInfo();
  updateResetTimeText();

  // Firebase同期リスナーをセットアップ
  if (typeof isFirebaseConnected === 'function' && isFirebaseConnected()) {
    setupFirebaseListeners();
  }
}

function updateFirebaseStatus(isConnected) {
  var statusElement = document.getElementById('firebaseStatus');
  if (!statusElement) return;

  if (isConnected) {
    statusElement.innerHTML = '<span style="color: #10b981;">✅ リアルタイム同期: 有効（全デバイス連動）</span>';
  } else {
    statusElement.innerHTML = '<span style="color: #6b7280;">📱 ローカルモード: このデバイスのみ</span>';
  }
}

function updateResetInfo() {
  var lastReset = localStorage.getItem('heater-last-reset');
  var infoElement = document.getElementById('resetInfo');
  if (infoElement) {
    if (lastReset) {
      var resetDate = new Date(lastReset);
      infoElement.textContent = '最終リセット: ' + resetDate.toLocaleString('ja-JP');
    } else {
      infoElement.textContent = '最終リセット: 未実行';
    }
  }
}

function updateResetTimeText() {
  var resetHour = parseInt(localStorage.getItem('heater-reset-hour') || '5');
  var textElement = document.getElementById('resetTimeText');
  if (textElement) {
    var timeLabel = getResetTimeLabel(resetHour);
    textElement.innerHTML = '<strong>毎日' + timeLabel + 'に自動リセット</strong> されます。退社時に必ずチェックしてください。';
  }
}

function getResetTimeLabel(hour) {
  if (hour === 0) return 'AM0時（深夜）';
  if (hour < 12) return 'AM' + hour + '時';
  if (hour === 12) return 'PM12時（正午）';
  return 'PM' + (hour - 12) + '時';
}

function loadData() {
  if (typeof isFirebaseConnected === 'function' && isFirebaseConnected()) {
    // Firebaseからデータを読み込み
    try {
      var db = getDatabase();
      for (var i = 0; i < factoryNames.length; i++) {
        (function(factoryIndex) {
          db.ref('factories/' + factoryIndex + '/employees').once('value').then(function(snapshot) {
            var data = snapshot.val();
            if (data) {
              allEmployees[factoryIndex] = data;
              // マイグレーション: typeがない社員にpermanentを設定
              migrateEmployeeTypes(factoryIndex);
            } else {
              allEmployees[factoryIndex] = [];
            }
            if (factoryIndex === currentTab) {
              renderEmployeeList();
            }
          }).catch(function(error) {
            console.warn('Firebase読み込みエラー:', error);
            loadFromLocalStorage(factoryIndex);
          });
        })(i);
      }
    } catch (e) {
      console.warn('Firebase使用不可、localStorageから読み込み');
      loadFromLocalStorage();
    }
  } else {
    // localStorageから読み込み（フォールバック）
    loadFromLocalStorage();
  }
}

function loadFromLocalStorage(factoryIndex) {
  if (factoryIndex !== undefined) {
    var key = 'heater-employees-' + factoryIndex;
    var saved = localStorage.getItem(key);
    if (saved) {
      allEmployees[factoryIndex] = JSON.parse(saved);
      // マイグレーション: typeがない社員にpermanentを設定
      migrateEmployeeTypes(factoryIndex);
    } else {
      allEmployees[factoryIndex] = [];
    }
    if (factoryIndex === currentTab) {
      renderEmployeeList();
    }
  } else {
    for (var i = 0; i < factoryNames.length; i++) {
      var key = 'heater-employees-' + i;
      var saved = localStorage.getItem(key);
      if (saved) {
        allEmployees[i] = JSON.parse(saved);
        // マイグレーション: typeがない社員にpermanentを設定
        migrateEmployeeTypes(i);
      } else {
        allEmployees[i] = [];
      }
    }
  }
}

// マイグレーション: typeプロパティがない既存データにpermanentを設定
function migrateEmployeeTypes(factoryIndex) {
  // allEmployeesが存在しない、またはfactoryIndexが範囲外の場合はスキップ
  if (!allEmployees || !allEmployees[factoryIndex]) {
    console.warn('⚠️ マイグレーションスキップ: allEmployees[' + factoryIndex + '] が存在しません');
    return;
  }

  var employees = allEmployees[factoryIndex];

  // 配列でない場合もスキップ
  if (!Array.isArray(employees)) {
    console.warn('⚠️ マイグレーションスキップ: allEmployees[' + factoryIndex + '] が配列ではありません');
    return;
  }

  var needsSave = false;
  var migrationCount = 0;

  for (var i = 0; i < employees.length; i++) {
    if (!employees[i]) {
      console.warn('⚠️ 不正なデータ: employees[' + i + '] が null/undefined です');
      continue;
    }

    // typeプロパティが存在しない、またはnull/undefinedの場合はpermanentを設定
    if (!employees[i].type) {
      console.log('🔄 マイグレーション: ' + employees[i].name + ' に type=permanent を設定');
      employees[i].type = 'permanent';
      needsSave = true;
      migrationCount++;
    }
  }

  // マイグレーションした場合は保存
  if (needsSave) {
    var key = 'heater-employees-' + factoryIndex;
    localStorage.setItem(key, JSON.stringify(employees));
    console.log('💾 工場' + (factoryIndex + 1) + 'のマイグレーション完了: ' + migrationCount + '名を permanent に設定');

    // Firebaseにも保存（全デバイスで同期）
    if (typeof isFirebaseConnected === 'function' && isFirebaseConnected()) {
      try {
        var db = getDatabase();
        db.ref('factories/' + factoryIndex + '/employees').set(employees)
          .then(function() {
            console.log('✅ マイグレーション済みデータをFirebaseに同期');
          })
          .catch(function(error) {
            console.error('❌ Firebase同期エラー:', error);
          });
      } catch (e) {
        console.warn('Firebase保存スキップ:', e);
      }
    }
  } else {
    console.log('✓ マイグレーション不要: 工場' + (factoryIndex + 1) + 'の全社員にtypeが設定済み');
  }
}

function saveData() {
  // localStorageにバックアップ保存（オフライン時用）
  var key = 'heater-employees-' + currentTab;
  localStorage.setItem(key, JSON.stringify(allEmployees[currentTab]));

  // Firebaseに保存（全デバイス同期）
  if (typeof isFirebaseConnected === 'function' && isFirebaseConnected()) {
    try {
      var db = getDatabase();
      db.ref('factories/' + currentTab + '/employees').set(allEmployees[currentTab])
        .then(function() {
          console.log('✅ データ同期成功 - 工場' + (currentTab + 1));
        })
        .catch(function(error) {
          console.error('❌ データ同期エラー:', error);
        });
    } catch (e) {
      console.warn('Firebase保存スキップ:', e);
    }
  }

  // データ変更イベントを発火（管理画面への通知）
  window.dispatchEvent(new Event('dataUpdated'));
}

function checkAndResetDaily() {
  var lastReset = localStorage.getItem('heater-last-reset');
  var now = new Date();
  var today = now.toDateString();
  var currentHour = now.getHours();

  // リセット時刻を取得（デフォルト: 5:00 AM）
  var resetHour = parseInt(localStorage.getItem('heater-reset-hour') || '5');

  console.log('⏰ リセットチェック - 現在時刻:', currentHour + '時', 'リセット設定:', resetHour + '時', '最終リセット:', lastReset, '今日:', today);

  // 設定時刻以降で、かつ前回のリセットが今日でない場合にリセット
  if (currentHour >= resetHour && lastReset !== today) {
    console.log('🔄 自動リセット実行中... (設定時刻: ' + resetHour + '時)');
    console.log('📝 チェック状態と「再使用」で追加された社員をクリアします');

    // ⚠️ 重要: リセット前に全工場のマイグレーションを実行（typeプロパティがない社員をpermanentに設定）
    console.log('🔧 リセット前マイグレーション開始...');
    for (var mf = 0; mf < factoryNames.length; mf++) {
      migrateEmployeeTypes(mf);
    }
    console.log('✅ リセット前マイグレーション完了');

    // 全工場をリセット
    for (var f = 0; f < factoryNames.length; f++) {
      console.log('━━━ 工場' + (f + 1) + ': ' + factoryNames[f] + ' リセット開始 ━━━');

      var employees = allEmployees[f] || [];
      var resetEmployees = [];
      var deletedCount = 0;
      var keptCount = 0;

      console.log('現在の社員数: ' + employees.length + '名');

      // リセットロジック:
      // - type が 'temporary' (再使用ボタン) → 削除
      // - type が 'permanent' (追加ボタン) → 残す（チェックのみリセット）
      // - type が未設定/null/undefined → 残す（チェックのみリセット）※既存データ保護
      for (var i = 0; i < employees.length; i++) {
        var emp = employees[i];

        if (!emp) {
          console.warn('⚠️ 不正なデータをスキップ: employees[' + i + '] が null/undefined');
          continue;
        }

        // 明示的にtemporaryの場合のみ削除
        if (emp.type === 'temporary') {
          console.log('🗑️ 削除: ' + emp.name + ' [type=' + emp.type + '] (再使用ボタンで登録)');
          deletedCount++;
        } else {
          // permanent または type未設定の場合は残す
          emp.checked = false;
          resetEmployees.push(emp);
          var typeLabel = emp.type || '未設定';
          console.log('✅ 残す: ' + emp.name + ' [type=' + typeLabel + '] (追加ボタン or 既存データ)');
          keptCount++;
        }
      }

      console.log('📊 工場' + (f + 1) + ' 統計: 削除=' + deletedCount + '名, 保持=' + keptCount + '名');

      allEmployees[f] = resetEmployees;

      // localStorageに保存
      var key = 'heater-employees-' + f;
      localStorage.setItem(key, JSON.stringify(allEmployees[f]));

      // Firebaseにもリセットを保存
      if (typeof isFirebaseConnected === 'function' && isFirebaseConnected()) {
        try {
          var db = getDatabase();
          db.ref('factories/' + f + '/employees').set(allEmployees[f]);
          console.log('🔥 Firebase工場' + (f + 1) + 'をリセット');
        } catch (e) {
          console.warn('Firebaseリセット保存スキップ:', e);
        }
      }
    }

    // リセット日時を記録
    localStorage.setItem('heater-last-reset', today);

    // Firebaseにリセット時刻を保存
    if (typeof syncResetToFirebase === 'function') {
      syncResetToFirebase();
    }

    // 履歴記録（各工場）
    for (var f = 0; f < factoryNames.length; f++) {
      var resetEmployees = allEmployees[f] || [];
      saveActivityLog('reset', '', '', {
        factory: f,
        factoryName: factoryNames[f],
        totalEmployees: resetEmployees.length,
        autoReset: true
      });
    }

    // UIを更新
    renderEmployeeList();

    console.log('✅ リセット完了 - 再使用の社員を削除、追加の社員は維持しました');
  } else {
    console.log('ℹ️ リセット不要（条件: ' + resetHour + '時以降 かつ 今日未実行）');
  }

  setTimeout(checkAndResetDaily, 60000);
}

function switchTab(index) {
  currentTab = index;
  var tabs = document.getElementsByClassName('tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].className = 'tab';
  }
  tabs[index].className = 'tab active';
  renderEmployeeList();
}

function getEmployees() {
  if (!allEmployees[currentTab]) {
    allEmployees[currentTab] = [];
  }
  return allEmployees[currentTab];
}

function renderEmployeeList() {
  var employees = getEmployees();
  var list = document.getElementById('employeeList');
  var checkedCount = 0;
  for (var i = 0; i < employees.length; i++) {
    if (employees[i].checked) {
      checkedCount = checkedCount + 1;
    }
  }
  var uncheckedCount = employees.length - checkedCount;

  // プログレスバーの更新
  var progressPercentage = employees.length > 0 ? (checkedCount / employees.length) * 100 : 0;
  var progressBar = document.getElementById('progressBar');
  if (progressBar) {
    progressBar.style.width = progressPercentage + '%';
  }

  document.getElementById('listTitle').textContent = factoryNames[currentTab] + ' 消火確認リスト (' + checkedCount + '/' + employees.length + ')';
  document.getElementById('uncheckedCount').textContent = '未確認: ' + uncheckedCount + '名';
  var html = '';
  for (var i = 0; i < employees.length; i++) {
    var emp = employees[i];
    var checkedClass = emp.checked ? 'checked' : '';
    var checkedAttr = emp.checked ? 'checked' : '';

    // typeに応じてクラスを追加
    var typeClass = '';
    if (emp.type === 'permanent') {
      typeClass = 'type-permanent';
    } else if (emp.type === 'temporary') {
      typeClass = 'type-temporary';
    }

    html = html + '<div class="employee-item ' + checkedClass + ' ' + typeClass + '">';
    html = html + '<input type="checkbox" ' + checkedAttr + ' onchange="toggleCheck(' + emp.id + ')">';
    html = html + '<span class="employee-name ' + checkedClass + '">' + emp.name + '</span>';
    html = html + '<button class="btn-delete" onclick="deleteEmployee(' + emp.id + ')">削除</button></div>';
  }
  list.innerHTML = html;
}

function toggleCheck(id) {
  var employees = getEmployees();
  for (var i = 0; i < employees.length; i++) {
    if (employees[i].id === id) {
      var wasChecked = employees[i].checked;
      employees[i].checked = !employees[i].checked;

      // 履歴記録
      saveActivityLog(
        employees[i].checked ? 'check' : 'uncheck',
        employees[i].name,
        employees[i].type
      );

      break;
    }
  }
  saveData();
  renderEmployeeList();
}

function addEmployee() {
  var numberInput = document.getElementById('employeeNumberInput');
  var nameInput = document.getElementById('employeeNameInput');
  var number = numberInput.value.trim();
  var name = nameInput.value.trim();

  if (number && name) {
    var employees = getEmployees();
    var newEmp = new Object();
    newEmp.id = Date.now();
    newEmp.name = number + ' ' + name;
    newEmp.checked = false;
    newEmp.type = 'permanent'; // 「追加」ボタンは永続的（削除しない）
    employees.push(newEmp);

    // 履歴記録
    saveActivityLog('add', newEmp.name, newEmp.type);

    saveData();
    renderEmployeeList();
    numberInput.value = '';
    nameInput.value = '';
  }
}

function deleteEmployee(id) {
  var employees = getEmployees();
  var newEmployees = [];
  var deletedEmployee = null;

  for (var i = 0; i < employees.length; i++) {
    if (employees[i].id !== id) {
      newEmployees.push(employees[i]);
    } else {
      deletedEmployee = employees[i];
    }
  }

  // 履歴記録
  if (deletedEmployee) {
    saveActivityLog('delete', deletedEmployee.name, deletedEmployee.type);
  }

  allEmployees[currentTab] = newEmployees;
  saveData();
  renderEmployeeList();
}

function reuseEmployee() {
  var numberInput = document.getElementById('reuseNumberInput');
  var nameInput = document.getElementById('reuseNameInput');
  var number = numberInput.value.trim();
  var name = nameInput.value.trim();

  if (number && name) {
    var employees = getEmployees();
    var newEmp = new Object();
    newEmp.id = Date.now();
    newEmp.name = number + ' ' + name;
    newEmp.checked = false;
    newEmp.type = 'temporary'; // 「再使用」ボタンは一時的（AM3時に削除）
    employees.push(newEmp);

    // 履歴記録
    saveActivityLog('reuse', newEmp.name, newEmp.type);

    saveData();
    renderEmployeeList();
    numberInput.value = '';
    nameInput.value = '';
  }
}

function handleFinalCheck() {
  var employees = getEmployees();
  var unchecked = [];
  for (var i = 0; i < employees.length; i++) {
    if (!employees[i].checked) {
      unchecked.push(employees[i]);
    }
  }

  // 履歴記録：最終確認の実行
  var additionalInfo = {
    totalCount: employees.length,
    checkedCount: employees.length - unchecked.length,
    uncheckedCount: unchecked.length,
    success: unchecked.length === 0,
    uncheckedNames: unchecked.map(function(e) { return e.name; })
  };
  saveActivityLog('final-check', '', '', additionalInfo);

  var modal = document.getElementById('warningModal');
  var content = document.getElementById('modalContent');
  var html = '';
  if (unchecked.length > 0) {
    html = html + '<div class="modal-header"><div class="modal-icon warning">⚠️</div>';
    html = html + '<h3 class="modal-title warning">警告</h3></div>';
    html = html + '<p style="color: #374151; font-weight: 600; margin-bottom: 16px;">';
    html = html + '【' + factoryNames[currentTab] + '】<br>以下の' + unchecked.length + '名の消火確認が完了していません：</p>';
    html = html + '<div class="unchecked-list">';
    for (var i = 0; i < unchecked.length; i++) {
      html = html + '<div class="unchecked-item"><span class="dot"></span>' + unchecked[i].name + '</div>';
    }
    html = html + '</div><button class="btn-modal dark" onclick="closeModal()">確認しました</button>';
  } else {
    html = html + '<div class="modal-header"><div class="modal-icon success">✓</div>';
    html = html + '<h3 class="modal-title success">確認完了</h3></div>';
    html = html + '<p style="color: #374151; font-weight: 600; text-align: center; margin-bottom: 16px;">';
    html = html + '【' + factoryNames[currentTab] + '】<br>全員の消火確認が完了しました！</p>';
    html = html + '<div class="success-box"><div class="success-emoji">🎉</div>';
    html = html + '<p style="color: #166534; font-weight: 500;">' + employees.length + '名全員の安全確認済み</p>';
    html = html + '<p style="color: #6b7280; font-size: 14px; margin-top: 8px;">お疲れ様でした</p></div>';
    html = html + '<button class="btn-modal success" onclick="closeModal()">閉じる</button>';
  }
  content.innerHTML = html;
  modal.classList.add('show');
}

function closeModal() {
  document.getElementById('warningModal').classList.remove('show');
}

function setupEvents() {
  var numberInput = document.getElementById('employeeNumberInput');
  var nameInput = document.getElementById('employeeNameInput');

  numberInput.onkeypress = function(e) {
    if (e.key === 'Enter') {
      addEmployee();
    }
  };

  nameInput.onkeypress = function(e) {
    if (e.key === 'Enter') {
      addEmployee();
    }
  };

  init();
}

// デバッグ・テスト機能
function testFirebaseSync() {
  console.log('🔄 Firebase同期テスト開始...');

  var isConnected = typeof isFirebaseConnected === 'function' && isFirebaseConnected();

  if (!isConnected) {
    alert('❌ Firebase未接続\n\nFirebase同期が無効です。\nローカルストレージモードで動作しています。\n\n詳細はブラウザコンソールを確認してください。');
    console.error('Firebase接続失敗');
    return;
  }

  try {
    var db = getDatabase();
    var testData = {
      name: 'テスト同期_' + new Date().toLocaleTimeString('ja-JP'),
      checked: false,
      type: 'temporary',
      timestamp: new Date().toISOString()
    };

    console.log('テストデータを書き込み中...', testData);

    db.ref('test/syncTest').set(testData)
      .then(function() {
        console.log('✅ 書き込み成功');

        return db.ref('test/syncTest').once('value');
      })
      .then(function(snapshot) {
        var readData = snapshot.val();
        console.log('✅ 読み込み成功', readData);

        alert('✅ 同期テスト成功！\n\nFirebaseとの通信が正常に動作しています。\n\n書き込んだデータ:\n' + JSON.stringify(readData, null, 2));
      })
      .catch(function(error) {
        console.error('❌ 同期エラー:', error);
        alert('❌ 同期エラー\n\n' + error.message);
      });

  } catch (e) {
    console.error('❌ テスト実行エラー:', e);
    alert('❌ テスト実行エラー\n\n' + e.message);
  }
}

// Service Worker Registration with Auto-Update
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js')
      .then(function(registration) {
        console.log('✅ Service Worker registered:', registration.scope);

        // 更新をチェック
        registration.update();

        // 新しいService Workerが待機中の場合、自動的にアクティブ化してリロード
        if (registration.waiting) {
          console.log('🔄 新しいバージョンを適用中...');
          registration.waiting.postMessage({ type: 'SKIP_WAITING' });
        }

        // 新しいService Workerがインストールされたら通知
        registration.addEventListener('updatefound', function() {
          var newWorker = registration.installing;
          console.log('📥 新しいバージョンをダウンロード中...');

          newWorker.addEventListener('statechange', function() {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // 新しいバージョンがインストールされた
              console.log('✨ 新しいバージョンが利用可能です。リロードします...');
              newWorker.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      })
      .catch(function(error) {
        console.log('❌ Service Worker登録失敗:', error);
      });

    // Service Workerが更新されてアクティブになったらページをリロード
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (!refreshing) {
        refreshing = true;
        console.log('🔄 ページを更新して最新版を表示します...');
        window.location.reload();
      }
    });
  });
}

// Firebaseリアルタイム同期リスナー
function setupFirebaseListeners() {
  if (typeof isFirebaseConnected !== 'function' || !isFirebaseConnected()) return;

  try {
    var db = getDatabase();
    console.log('🔄 リアルタイム同期を開始...');

    // 各工場のデータ変更をリスニング
    for (var i = 0; i < factoryNames.length; i++) {
      (function(factoryIndex) {
        db.ref('factories/' + factoryIndex + '/employees').on('value', function(snapshot) {
          var data = snapshot.val();

          // データが存在する場合も、nullや空配列の場合も処理
          if (data === null || data === undefined) {
            // Firebaseでデータが削除された（リセットされた）場合
            allEmployees[factoryIndex] = [];
            console.log('🔄 ' + factoryNames[factoryIndex] + 'がリセットされました（Firebase同期）');
          } else {
            allEmployees[factoryIndex] = data;
            // マイグレーション: typeがない社員にpermanentを設定
            migrateEmployeeTypes(factoryIndex);
            console.log('🔄 ' + factoryNames[factoryIndex] + 'のデータを同期しました');
          }

          // 現在表示中の工場の場合はUIを更新
          if (factoryIndex === currentTab) {
            renderEmployeeList();
          }

          // localStorageにもバックアップ
          var key = 'heater-employees-' + factoryIndex;
          localStorage.setItem(key, JSON.stringify(allEmployees[factoryIndex]));
        });
      })(i);
    }

    // リセット時刻の同期
    db.ref('settings/lastReset').on('value', function(snapshot) {
      var lastReset = snapshot.val();
      if (lastReset) {
        var currentLocalReset = localStorage.getItem('heater-last-reset');
        if (currentLocalReset !== lastReset) {
          localStorage.setItem('heater-last-reset', lastReset);
          console.log('🔄 リセット時刻を同期:', lastReset);
        }
      }
    });

    // 自動リセット時刻設定の同期
    db.ref('settings/resetHour').on('value', function(snapshot) {
      var resetHour = snapshot.val();
      if (resetHour !== null && resetHour !== undefined) {
        var currentResetHour = localStorage.getItem('heater-reset-hour');
        if (currentResetHour !== String(resetHour)) {
          localStorage.setItem('heater-reset-hour', resetHour);
          updateResetTimeText();
          console.log('🔄 自動リセット時刻設定を同期:', resetHour + '時');
        }
      }
    });

    console.log('✅ 全デバイス同期が有効になりました！');
    console.log('💡 他のデバイスでの変更が自動的に反映されます');
  } catch (e) {
    console.warn('Firebaseリスナー設定エラー:', e);
  }
}

// リセット処理もFirebaseに保存
function syncResetToFirebase() {
  if (typeof isFirebaseConnected !== 'function' || !isFirebaseConnected()) return;

  try {
    var db = getDatabase();
    var today = new Date().toDateString();
    db.ref('settings/lastReset').set(today);
  } catch (e) {
    console.warn('Firebaseリセット同期エラー:', e);
  }
}

// デバッグ: 社員のTYPEを確認
function debugEmployeeTypes() {
  var employees = getEmployees();
  var info = '🔍 現在の社員TYPE詳細\n\n';
  info += '工場: ' + factoryNames[currentTab] + '\n';
  info += '社員数: ' + employees.length + '名\n\n';

  var permanentCount = 0;
  var temporaryCount = 0;
  var noTypeCount = 0;

  for (var i = 0; i < employees.length; i++) {
    var emp = employees[i];
    info += '--- 社員 ' + (i + 1) + ' ---\n';
    info += '名前: ' + emp.name + '\n';
    info += 'ID: ' + emp.id + '\n';
    info += 'TYPE: ' + (emp.type || 'なし') + '\n';
    info += 'チェック: ' + (emp.checked ? 'ON' : 'OFF') + '\n\n';

    if (emp.type === 'permanent') {
      permanentCount++;
    } else if (emp.type === 'temporary') {
      temporaryCount++;
    } else {
      noTypeCount++;
    }
  }

  info += '--- 集計 ---\n';
  info += '📘 追加ボタン (permanent): ' + permanentCount + '名\n';
  info += '🟡 再使用ボタン (temporary): ' + temporaryCount + '名\n';
  info += '❓ TYPEなし: ' + noTypeCount + '名\n\n';

  if (noTypeCount > 0) {
    info += '⚠️ TYPEが設定されていない社員がいます！\n';
    info += 'これらの社員はリセット時に削除される可能性があります。\n';
  }

  console.log(info);
  alert(info);
}

// ============================================
// Activity History (操作履歴記録)
// ============================================
function saveActivityLog(type, employeeName, employeeType, additionalInfo) {
  var history = JSON.parse(localStorage.getItem('heater-activity-history') || '[]');

  var activity = {
    timestamp: new Date().toISOString(),
    type: type, // 'add', 'delete', 'check', 'uncheck', 'reset'
    factory: currentTab,
    factoryName: factoryNames[currentTab],
    employeeName: employeeName || '',
    employeeType: employeeType || '',
    additionalInfo: additionalInfo || {}
  };

  history.unshift(activity);

  // 最新500件のみ保持
  if (history.length > 500) {
    history.length = 500;
  }

  localStorage.setItem('heater-activity-history', JSON.stringify(history));
  console.log('📝 履歴記録:', activity);

  // カスタムイベントを発火して即座に管理画面に通知
  window.dispatchEvent(new Event('activityUpdated'));
}

// デバッグ: リセット機能をテスト（実際にはリセットしない）
function testResetFunction() {
  var employees = getEmployees();
  var info = '🧪 リセット動作シミュレーション\n\n';
  info += '工場: ' + factoryNames[currentTab] + '\n';
  info += '現在の社員数: ' + employees.length + '名\n\n';

  var willKeep = [];
  var willDelete = [];

  for (var i = 0; i < employees.length; i++) {
    var emp = employees[i];
    if (emp.type === 'temporary') {
      willDelete.push(emp);
    } else {
      willKeep.push(emp);
    }
  }

  info += '--- リセット後の状態（予測） ---\n\n';
  info += '✅ 維持される社員: ' + willKeep.length + '名\n';
  for (var i = 0; i < willKeep.length; i++) {
    info += '  - ' + willKeep[i].name + ' [' + (willKeep[i].type || 'TYPE未設定') + ']\n';
  }

  info += '\n🗑️ 削除される社員: ' + willDelete.length + '名\n';
  for (var i = 0; i < willDelete.length; i++) {
    info += '  - ' + willDelete[i].name + ' [' + willDelete[i].type + ']\n';
  }

  info += '\n※ これはシミュレーションです。実際のデータは変更されていません。';

  console.log(info);
  alert(info);
}
