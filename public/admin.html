<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 - 灯油ストーブ消火確認アプリ</title>

  <!-- Authentication -->
  <script src="./auth.js"></script>

  <style>
    /* ============================================
       CSS Variables - index.htmlと統一
       ============================================ */
    :root {
      --primary-red: #f43f5e;
      --primary-red-dark: #e11d48;
      --primary-red-light: #fb7185;
      --accent-orange: #fb923c;
      --accent-yellow: #fbbf24;
      --success-green: #10b981;
      --success-green-dark: #059669;
      --info-blue: #3b82f6;
      --info-blue-light: #60a5fa;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;

      --bg-gradient-start: #fff1f2;
      --bg-gradient-end: #ffe4e6;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);

      --transition-fast: 150ms ease-in-out;
      --transition-normal: 300ms ease-in-out;
      --transition-slow: 500ms ease-in-out;
    }

    /* ============================================
       Reset & Base Styles
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      padding: 20px;
      color: var(--gray-800);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ============================================
       Header
       ============================================ */
    .header-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      padding: 24px;
      margin-bottom: 24px;
      transition: all var(--transition-normal);
    }

    .header-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-icon {
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--primary-red-dark) 100%);
      padding: 16px;
      border-radius: 12px;
      font-size: 28px;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3); }
      50% { box-shadow: 0 4px 20px rgba(244, 63, 94, 0.5); }
    }

    h1 {
      font-size: 26px;
      color: var(--gray-900);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--gray-500);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 12px;
    }

    .status-badge.success {
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
      color: #065f46;
    }

    .status-badge.warning {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      color: #92400e;
    }

    /* ============================================
       Dashboard Grid
       ============================================ */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      padding: 20px;
      transition: all var(--transition-normal);
    }

    .stat-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .stat-title {
      font-size: 14px;
      color: var(--gray-600);
      font-weight: 600;
    }

    .stat-icon {
      font-size: 20px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 8px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--gray-500);
    }

    .stat-breakdown {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--gray-200);
    }

    .stat-item {
      flex: 1;
      text-align: center;
    }

    .stat-item-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-800);
    }

    .stat-item-label {
      font-size: 11px;
      color: var(--gray-500);
      margin-top: 4px;
    }

    /* ============================================
       Cards
       ============================================ */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      padding: 24px;
      margin-bottom: 20px;
      transition: all var(--transition-normal);
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ============================================
       Buttons
       ============================================ */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: all var(--transition-fast);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }

    .btn-danger:hover {
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.3);
    }

    .btn-warning {
      background: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-orange) 100%);
      color: white;
    }

    .btn-warning:hover {
      box-shadow: 0 6px 16px rgba(251, 191, 36, 0.3);
    }

    .btn-info {
      background: linear-gradient(135deg, var(--info-blue) 0%, var(--info-blue-light) 100%);
      color: white;
    }

    .btn-info:hover {
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success-green) 0%, var(--success-green-dark) 100%);
      color: white;
    }

    .btn-success:hover {
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
    }

    .btn-secondary {
      background: linear-gradient(135deg, var(--gray-600) 0%, var(--gray-700) 100%);
      color: white;
    }

    /* ============================================
       Factory Selectors
       ============================================ */
    .factory-selectors {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .factory-card {
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid var(--gray-200);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }

    .factory-card:hover {
      background: rgba(255, 255, 255, 0.9);
      border-color: var(--info-blue);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .factory-card.selected {
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
      border-color: var(--info-blue);
      box-shadow: var(--shadow-md);
    }

    .factory-name {
      font-weight: 600;
      color: var(--gray-900);
      margin-bottom: 8px;
    }

    .factory-stats {
      font-size: 12px;
      color: var(--gray-600);
    }

    /* ============================================
       Timeline (X/Twitter Style)
       ============================================ */
    .timeline-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
      max-height: 600px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .timeline-container::-webkit-scrollbar {
      width: 8px;
    }

    .timeline-container::-webkit-scrollbar-track {
      background: var(--gray-100);
      border-radius: 10px;
    }

    .timeline-container::-webkit-scrollbar-thumb {
      background: var(--gray-300);
      border-radius: 10px;
    }

    .timeline-container::-webkit-scrollbar-thumb:hover {
      background: var(--gray-400);
    }

    .timeline-item {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 16px;
      transition: all var(--transition-fast);
      display: flex;
      gap: 12px;
    }

    .timeline-item:hover {
      background: rgba(255, 255, 255, 0.95);
      border-color: var(--gray-300);
      box-shadow: var(--shadow);
      transform: translateX(2px);
    }

    .timeline-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: var(--shadow-sm);
    }

    .timeline-icon.type-add {
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
    }

    .timeline-icon.type-reuse {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    }

    .timeline-icon.type-delete {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
    }

    .timeline-icon.type-check {
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
    }

    .timeline-icon.type-uncheck {
      background: linear-gradient(135deg, #e5e7eb 0%, #d1d5db 100%);
    }

    .timeline-icon.type-reset {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    }

    .timeline-icon.type-final-check {
      background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
    }

    .timeline-content {
      flex: 1;
      min-width: 0;
    }

    .timeline-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .timeline-action {
      font-weight: 600;
      color: var(--gray-900);
      font-size: 14px;
    }

    .timeline-factory {
      font-size: 13px;
      color: var(--gray-600);
      font-weight: 500;
    }

    .timeline-employee {
      font-size: 14px;
      color: var(--gray-800);
      margin-top: 4px;
    }

    .timeline-timestamp {
      font-size: 12px;
      color: var(--gray-500);
      margin-top: 4px;
    }

    .timeline-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 4px;
    }

    .timeline-badge.permanent {
      background: rgba(59, 130, 246, 0.15);
      color: var(--info-blue);
    }

    .timeline-badge.temporary {
      background: rgba(251, 191, 36, 0.15);
      color: var(--accent-orange);
    }

    .timeline-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--gray-500);
    }

    .timeline-filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 2px solid var(--gray-200);
      background: white;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      color: var(--gray-600);
    }

    .filter-btn:hover {
      border-color: var(--info-blue);
      color: var(--info-blue);
    }

    .filter-btn.active {
      background: var(--info-blue);
      border-color: var(--info-blue);
      color: white;
    }

    /* ============================================
       Warning Modal
       ============================================ */
    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      animation: fadeIn 0.2s ease-out;
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .warning-modal {
      border: 3px solid var(--primary-red);
    }

    .warning-header {
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--primary-red-dark) 100%);
      padding: 24px;
      text-align: center;
      border-radius: 13px 13px 0 0;
    }

    .warning-icon {
      font-size: 64px;
      margin-bottom: 12px;
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .warning-title {
      font-size: 24px;
      font-weight: 700;
      color: white;
      margin: 0;
    }

    .warning-body {
      padding: 24px;
    }

    .warning-message {
      font-size: 16px;
      color: var(--gray-800);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .warning-details {
      background: var(--gray-100);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .warning-detail-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--gray-200);
    }

    .warning-detail-item:last-child {
      border-bottom: none;
    }

    .warning-detail-label {
      font-weight: 600;
      color: var(--gray-700);
    }

    .warning-detail-value {
      color: var(--primary-red);
      font-weight: 700;
    }

    .warning-actions {
      display: flex;
      gap: 12px;
    }

    .warning-btn {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .warning-btn-cancel {
      background: var(--gray-200);
      color: var(--gray-700);
    }

    .warning-btn-cancel:hover {
      background: var(--gray-300);
    }

    .warning-btn-confirm {
      background: linear-gradient(135deg, var(--primary-red) 0%, var(--primary-red-dark) 100%);
      color: white;
    }

    .warning-btn-confirm:hover {
      box-shadow: 0 6px 16px rgba(244, 63, 94, 0.4);
      transform: translateY(-2px);
    }

    /* ============================================
       Responsive
       ============================================ */
    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .btn-group {
        grid-template-columns: 1fr;
      }

      .factory-selectors {
        grid-template-columns: repeat(2, 1fr);
      }

      .timeline-item {
        padding: 12px;
      }

      .timeline-icon {
        width: 36px;
        height: 36px;
        font-size: 16px;
      }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="./firebase-config.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header-card">
      <div class="header-content">
        <div class="admin-icon">⚙️</div>
        <div style="flex: 1;">
          <h1>管理画面</h1>
          <p class="subtitle">灯油ストーブ消火確認アプリ - 統合管理システム</p>
          <div id="statusBadge" class="status-badge warning">
            <span>🔄</span>
            <span>接続確認中...</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Statistics Dashboard -->
    <div class="dashboard-grid" id="dashboardGrid"></div>

    <!-- Settings Section -->
    <div class="card">
      <h2 class="card-title">⚙️ システム設定</h2>
      <div style="margin-bottom: 20px;">
        <label style="display: block; color: var(--gray-700); font-weight: 600; margin-bottom: 8px;">
          🕐 自動リセット時刻
        </label>
        <p style="color: var(--gray-600); font-size: 13px; margin-bottom: 12px;">
          毎日この時刻以降に自動リセットが実行されます
        </p>
        <div style="display: flex; gap: 12px; align-items: center;">
          <select id="resetHourSelect" style="padding: 8px 12px; border-radius: 8px; border: 1px solid var(--gray-300); font-size: 14px;">
            <option value="0">AM 0:00</option>
            <option value="1">AM 1:00</option>
            <option value="2">AM 2:00</option>
            <option value="3">AM 3:00</option>
            <option value="4">AM 4:00</option>
            <option value="5" selected>AM 5:00</option>
            <option value="6">AM 6:00</option>
            <option value="7">AM 7:00</option>
            <option value="8">AM 8:00</option>
            <option value="9">AM 9:00</option>
            <option value="10">AM 10:00</option>
            <option value="11">AM 11:00</option>
            <option value="12">PM 12:00</option>
            <option value="13">PM 1:00</option>
            <option value="14">PM 2:00</option>
            <option value="15">PM 3:00</option>
            <option value="16">PM 4:00</option>
            <option value="17">PM 5:00</option>
            <option value="18">PM 6:00</option>
            <option value="19">PM 7:00</option>
            <option value="20">PM 8:00</option>
            <option value="21">PM 9:00</option>
            <option value="22">PM 10:00</option>
            <option value="23">PM 11:00</option>
          </select>
          <button class="btn btn-primary" onclick="saveResetTime()">
            💾 保存
          </button>
        </div>
        <p id="resetTimeStatus" style="color: var(--gray-600); font-size: 12px; margin-top: 8px;">
          現在の設定: AM 5:00
        </p>
      </div>

      <hr style="border: none; border-top: 1px solid var(--gray-200); margin: 30px 0;">

      <div style="margin-bottom: 20px;">
        <label style="display: block; color: var(--gray-700); font-weight: 600; margin-bottom: 8px;">
          🔐 パスワード変更
        </label>
        <p style="color: var(--gray-600); font-size: 13px; margin-bottom: 12px;">
          アプリのログインパスワードを変更できます
        </p>

        <div style="max-width: 400px;">
          <input
            type="password"
            id="currentPassword"
            placeholder="現在のパスワード"
            style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--gray-300); font-size: 14px; margin-bottom: 10px;"
          >
          <input
            type="password"
            id="newPassword"
            placeholder="新しいパスワード（4文字以上）"
            style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--gray-300); font-size: 14px; margin-bottom: 10px;"
          >
          <input
            type="password"
            id="confirmPassword"
            placeholder="新しいパスワード（確認）"
            style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--gray-300); font-size: 14px; margin-bottom: 12px;"
          >

          <button class="btn btn-primary" onclick="changeAppPassword()">
            🔒 パスワードを変更
          </button>

          <p id="passwordChangeStatus" style="color: var(--gray-600); font-size: 12px; margin-top: 8px;">
            デフォルトパスワード: hmt1541
          </p>
        </div>
      </div>
    </div>

    <!-- Factory Reset Section -->
    <div class="card">
      <h2 class="card-title">🏭 工場別リセット</h2>
      <p style="color: var(--gray-600); font-size: 14px; margin-bottom: 16px;">
        リセットしたい工場を選択してください（複数選択可）
      </p>
      <div class="factory-selectors" id="factorySelectors"></div>
      <div class="btn-group">
        <button class="btn btn-warning" onclick="resetSelectedFactories()">
          🔄 選択した工場をリセット
        </button>
        <button class="btn btn-info" onclick="refreshDashboard()">
          🔄 データを再読み込み
        </button>
      </div>
    </div>

    <!-- System Actions -->

  <div id="warningModal" class="modal">

  <script>
    let db = null;
    const factoryNames = ['第一工場', '第二工場', '第三工場', '第四工場'];
    let selectedFactories = new Set();
    let allData = {};

    // ============================================
    // Warning Modal
    // ============================================
    function showWarningModal(config) {
      return new Promise((resolve) => {
        const modal = document.getElementById('warningModal');
        const content = document.getElementById('warningModalContent');

        let detailsHtml = '';
        if (config.details && config.details.length > 0) {
          detailsHtml = '<div class="warning-details">';
          for (const detail of config.details) {
            detailsHtml += `
              <div class="warning-detail-item">
                <span class="warning-detail-label">${detail.label}</span>
                <span class="warning-detail-value">${detail.value}</span>
              </div>
            `;
          }
          detailsHtml += '</div>';
        }

        content.innerHTML = `
          <div class="warning-header">
            <div class="warning-icon">${config.icon || '⚠️'}</div>
            <h2 class="warning-title">${config.title}</h2>
          </div>
          <div class="warning-body">
            <p class="warning-message">${config.message}</p>
            ${detailsHtml}
            <div class="warning-actions">
              <button class="warning-btn warning-btn-cancel" onclick="closeWarningModal(false)">
                ${config.cancelText || 'キャンセル'}
              </button>
              <button class="warning-btn warning-btn-confirm" onclick="closeWarningModal(true)">
                ${config.confirmText || '実行する'}
              </button>
            </div>
          </div>
        `;

        modal.classList.add('show');

        // Store resolve function globally
        window._warningModalResolve = resolve;
      });
    }

    function closeWarningModal(confirmed) {
      const modal = document.getElementById('warningModal');
      modal.classList.remove('show');

      if (window._warningModalResolve) {
        window._warningModalResolve(confirmed);
        window._warningModalResolve = null;
      }
    }

    // ============================================
    // Utility Functions
    // ============================================
    function log(msg, type = 'info') {
      const icons = {
        info: '📘',
        success: '✅',
        warning: '⚠️',
        error: '❌'
      };
      const icon = icons[type] || '📘';
      console.log(`${icon} ${msg}`);
    }

    function updateStatus(msg, isSuccess = true) {
      const badge = document.getElementById('statusBadge');
      badge.innerHTML = `
        <span>${isSuccess ? '✅' : '⚠️'}</span>
        <span>${msg}</span>
      `;
      badge.className = 'status-badge ' + (isSuccess ? 'success' : 'warning');
    }

    // ============================================
    // Data Loading
    // ============================================
    // マイグレーション: typeプロパティがない既存データにpermanentを設定
    function migrateEmployeeTypes(factoryIndex) {
      const employees = allData[factoryIndex];
      if (!Array.isArray(employees)) return;

      let needsSave = false;

      for (let i = 0; i < employees.length; i++) {
        if (!employees[i].type) {
          log(`🔄 マイグレーション: ${employees[i].name} → type=permanent`, 'info');
          employees[i].type = 'permanent';
          needsSave = true;
        }
      }

      // マイグレーションした場合は保存
      if (needsSave) {
        const key = 'heater-employees-' + factoryIndex;
        localStorage.setItem(key, JSON.stringify(employees));
        log(`💾 ${factoryNames[factoryIndex]}のマイグレーション完了`, 'success');

        // Firebaseにも保存（全デバイスで同期）
        if (db) {
          db.ref('factories/' + factoryIndex + '/employees').set(employees)
            .then(() => {
              log(`✅ ${factoryNames[factoryIndex]}のマイグレーションをFirebaseに同期`, 'success');
            })
            .catch((error) => {
              log(`❌ Firebase同期エラー: ${factoryNames[factoryIndex]}`, 'error');
            });
        }
      }
    }

    async function loadAllData() {
      allData = {};
      for (let i = 0; i < 4; i++) {
        const key = 'heater-employees-' + i;
        const saved = localStorage.getItem(key);
        allData[i] = saved ? JSON.parse(saved) : [];

        // マイグレーション: typeがない社員にpermanentを設定
        migrateEmployeeTypes(i);
      }
    }

    // ============================================
    // Dashboard
    // ============================================
    async function refreshDashboard() {
      log('ダッシュボードを更新中...');
      await loadAllData();

      const grid = document.getElementById('dashboardGrid');
      grid.innerHTML = '';

      let totalEmployees = 0;
      let totalChecked = 0;
      let totalPermanent = 0;
      let totalTemporary = 0;

      for (let i = 0; i < 4; i++) {
        const employees = allData[i] || [];
        const checked = employees.filter(e => e.checked).length;
        const permanent = employees.filter(e => e.type === 'permanent').length;
        const temporary = employees.filter(e => e.type === 'temporary').length;

        totalEmployees += employees.length;
        totalChecked += checked;
        totalPermanent += permanent;
        totalTemporary += temporary;

        const card = document.createElement('div');
        card.className = 'stat-card';
        card.innerHTML = `
          <div class="stat-header">
            <span class="stat-title">${factoryNames[i]}</span>
            <span class="stat-icon">🏭</span>
          </div>
          <div class="stat-value">${employees.length}<span style="font-size: 18px; color: var(--gray-500);">名</span></div>
          <div class="stat-label">登録社員数</div>
          <div class="stat-breakdown">
            <div class="stat-item">
              <div class="stat-item-value" style="color: var(--success-green);">${checked}</div>
              <div class="stat-item-label">確認済</div>
            </div>
            <div class="stat-item">
              <div class="stat-item-value" style="color: var(--info-blue);">${permanent}</div>
              <div class="stat-item-label">追加</div>
            </div>
            <div class="stat-item">
              <div class="stat-item-value" style="color: var(--accent-orange);">${temporary}</div>
              <div class="stat-item-label">再使用</div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      }

      // Summary Card
      const summaryCard = document.createElement('div');
      summaryCard.className = 'stat-card';
      summaryCard.style.background = 'linear-gradient(135deg, #fef3c7 0%, #fde68a 100%)';
      summaryCard.innerHTML = `
        <div class="stat-header">
          <span class="stat-title">全工場合計</span>
          <span class="stat-icon">📊</span>
        </div>
        <div class="stat-value">${totalEmployees}<span style="font-size: 18px; color: var(--gray-600);">名</span></div>
        <div class="stat-label">総登録社員数</div>
        <div class="stat-breakdown">
          <div class="stat-item">
            <div class="stat-item-value" style="color: var(--success-green);">${totalChecked}</div>
            <div class="stat-item-label">確認済</div>
          </div>
          <div class="stat-item">
            <div class="stat-item-value" style="color: var(--info-blue);">${totalPermanent}</div>
            <div class="stat-item-label">追加</div>
          </div>
          <div class="stat-item">
            <div class="stat-item-value" style="color: var(--accent-orange);">${totalTemporary}</div>
            <div class="stat-item-label">再使用</div>
          </div>
        </div>
      `;
      grid.appendChild(summaryCard);

      renderFactorySelectors();
      renderTimeline(currentFilter);
    }

    // ============================================
    // Factory Selectors
    // ============================================
    function renderFactorySelectors() {
      const container = document.getElementById('factorySelectors');
      container.innerHTML = '';

      for (let i = 0; i < 4; i++) {
        const employees = allData[i] || [];
        const card = document.createElement('div');
        card.className = 'factory-card' + (selectedFactories.has(i) ? ' selected' : '');
        card.onclick = () => toggleFactory(i);
        card.innerHTML = `
          <div class="factory-name">${factoryNames[i]}</div>
          <div class="factory-stats">${employees.length}名登録</div>
        `;
        container.appendChild(card);
      }
    }

    function toggleFactory(index) {
      if (selectedFactories.has(index)) {
        selectedFactories.delete(index);
      } else {
        selectedFactories.add(index);
      }
      renderFactorySelectors();
    }

    // ============================================
    // Reset Functions
    // ============================================
    async function resetSelectedFactories() {
      if (selectedFactories.size === 0) {
        alert('リセットする工場を選択してください');
        return;
      }

      const factoryList = Array.from(selectedFactories).map(i => factoryNames[i]).join('、');

      // 統計情報を計算
      let totalEmployees = 0;
      let totalTemporary = 0;
      for (const i of selectedFactories) {
        const employees = allData[i] || [];
        totalEmployees += employees.length;
        totalTemporary += employees.filter(e => e.type === 'temporary').length;
      }

      const confirmed = await showWarningModal({
        icon: '🔄',
        title: '選択した工場をリセット',
        message: `以下の工場をリセットしようとしています。この操作は取り消せません。`,
        details: [
          { label: '対象工場', value: factoryList },
          { label: '登録社員数', value: `${totalEmployees}名` },
          { label: '削除される社員', value: `${totalTemporary}名（再使用）` },
          { label: '維持される社員', value: `${totalEmployees - totalTemporary}名（追加）` }
        ],
        confirmText: 'リセットを実行',
        cancelText: 'キャンセル'
      });

      if (!confirmed) {
        log('リセットをキャンセルしました');
        return;
      }

      log(`選択した工場のリセットを開始: ${factoryList}`, 'info');

      let totalDeleted = 0;
      let totalKept = 0;

      for (const i of selectedFactories) {
        const employees = allData[i] || [];
        const resetEmployees = [];
        let deleted = 0;
        let kept = 0;

        for (const emp of employees) {
          if (emp.type === 'temporary') {
            deleted++;
            log(`  [削除] ${factoryNames[i]} - ${emp.name}`, 'warning');
          } else {
            emp.checked = false;
            resetEmployees.push(emp);
            kept++;
          }
        }

        allData[i] = resetEmployees;
        localStorage.setItem('heater-employees-' + i, JSON.stringify(resetEmployees));

        if (db) {
          try {
            await db.ref('factories/' + i + '/employees').set(resetEmployees);
          } catch (e) {
            log(`Firebase同期エラー: ${factoryNames[i]}`, 'error');
          }
        }

        totalDeleted += deleted;
        totalKept += kept;
        log(`${factoryNames[i]}: 削除${deleted}名、保持${kept}名`, 'success');
      }

      log(`リセット完了 - 合計: 削除${totalDeleted}名、保持${totalKept}名`, 'success');
      selectedFactories.clear();
      await refreshDashboard();
    }

    async function manualResetAll() {
      // 統計情報を計算
      let totalEmployees = 0;
      let totalTemporary = 0;
      for (let i = 0; i < 4; i++) {
        const employees = allData[i] || [];
        totalEmployees += employees.length;
        totalTemporary += employees.filter(e => e.type === 'temporary').length;
      }

      const confirmed = await showWarningModal({
        icon: '🔄',
        title: '全工場を手動リセット',
        message: `全工場をリセットしようとしています。この操作は取り消せません。`,
        details: [
          { label: '対象工場', value: '全4工場' },
          { label: '登録社員数', value: `${totalEmployees}名` },
          { label: '削除される社員', value: `${totalTemporary}名（再使用）` },
          { label: '維持される社員', value: `${totalEmployees - totalTemporary}名（追加）` }
        ],
        confirmText: '全工場をリセット',
        cancelText: 'キャンセル'
      });

      if (!confirmed) {
        log('全工場リセットをキャンセルしました');
        return;
      }

      log('全工場の手動リセット開始', 'info');

      let totalDeleted = 0;
      let totalKept = 0;

      for (let i = 0; i < 4; i++) {
        const employees = allData[i] || [];
        const resetEmployees = [];
        let deleted = 0;
        let kept = 0;

        for (const emp of employees) {
          if (emp.type === 'temporary') {
            deleted++;
          } else {
            emp.checked = false;
            resetEmployees.push(emp);
            kept++;
          }
        }

        allData[i] = resetEmployees;
        localStorage.setItem('heater-employees-' + i, JSON.stringify(resetEmployees));

        if (db) {
          try {
            await db.ref('factories/' + i + '/employees').set(resetEmployees);
          } catch (e) {
            log(`Firebase同期エラー: ${factoryNames[i]}`, 'error');
          }
        }

        totalDeleted += deleted;
        totalKept += kept;
        log(`${factoryNames[i]}: 削除${deleted}名、保持${kept}名`, 'success');
      }

      // リセット時刻を記録
      const now = new Date().toDateString();
      localStorage.setItem('heater-last-reset', now);
      if (db) {
        await db.ref('settings/lastReset').set(now);
      }

      log(`全工場リセット完了 - 合計: 削除${totalDeleted}名、保持${totalKept}名`, 'success');
      await refreshDashboard();
    }

    async function forceResetAll() {
      // 統計情報を計算
      let totalEmployees = 0;
      for (let i = 0; i < 4; i++) {
        const employees = allData[i] || [];
        totalEmployees += employees.length;
      }

      const resetHistory = JSON.parse(localStorage.getItem('heater-reset-history') || '[]');
      const activityHistory = JSON.parse(localStorage.getItem('heater-activity-history') || '[]');

      // 第一段階：データの概要を表示
      const confirmed1 = await showWarningModal({
        icon: '🗑️',
        title: '全データを完全削除',
        message: `すべてのデータを完全に削除しようとしています。<br><strong style="color: var(--primary-red);">この操作は絶対に取り消せません！</strong>`,
        details: [
          { label: '削除される社員', value: `${totalEmployees}名（全工場）` },
          { label: '削除されるリセット履歴', value: `${resetHistory.length}件` },
          { label: '削除される操作履歴', value: `${activityHistory.length}件` },
          { label: '影響範囲', value: '全工場・全データ' }
        ],
        confirmText: '次へ進む',
        cancelText: 'キャンセル'
      });

      if (!confirmed1) {
        log('全データ削除をキャンセルしました');
        return;
      }

      // 第二段階：最終確認（より強い警告）
      const confirmed2 = await showWarningModal({
        icon: '⚠️',
        title: '最終確認',
        message: `<strong style="font-size: 18px; color: var(--primary-red);">本当に実行しますか？</strong><br><br>この操作を実行すると、${totalEmployees}名の社員データ、${resetHistory.length}件のリセット履歴、${activityHistory.length}件の操作履歴が完全に削除されます。<br><br><strong>もう一度よく確認してください。</strong>`,
        details: [],
        confirmText: '完全に削除する',
        cancelText: 'やめる'
      });

      if (!confirmed2) {
        log('全データ削除をキャンセルしました（最終確認）');
        return;
      }

      log('全データ削除開始', 'warning');

      for (let i = 0; i < 4; i++) {
        localStorage.removeItem('heater-employees-' + i);
        if (db) {
          await db.ref('factories/' + i + '/employees').set([]);
        }
        log(`${factoryNames[i]}を削除`, 'warning');
      }

      localStorage.removeItem('heater-last-reset');
      localStorage.removeItem('heater-reset-history');
      if (db) {
        await db.ref('settings/lastReset').remove();
      }

      log('全データ削除完了', 'success');
      await refreshDashboard();
      alert('全データを削除しました。\n\nメインアプリをリロードしてください。');
    }

    function backupData() {
      const backup = {
        timestamp: new Date().toISOString(),
        factories: allData,
        lastReset: localStorage.getItem('heater-last-reset'),
        history: JSON.parse(localStorage.getItem('heater-reset-history') || '[]')
      };

      const dataStr = JSON.stringify(backup, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `heater-backup-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();

      log('データをバックアップしました', 'success');
    }

    // ============================================
    // Settings Functions
    // ============================================

    function saveResetTime() {
      const select = document.getElementById('resetHourSelect');
      const resetHour = parseInt(select.value);

      // Save to localStorage and Firebase
      localStorage.setItem('heater-reset-hour', resetHour);

      if (db) {
        db.ref('settings/resetHour').set(resetHour);
      }

      // Update status display
      updateResetTimeDisplay(resetHour);

      log(`自動リセット時刻を ${getTimeLabel(resetHour)} に設定しました`, 'success');

      // Show success message
      const status = document.getElementById('resetTimeStatus');
      status.style.color = 'var(--primary-green)';
      status.textContent = `✅ 保存しました: ${getTimeLabel(resetHour)}`;

      setTimeout(() => {
        status.style.color = 'var(--gray-600)';
        status.textContent = `現在の設定: ${getTimeLabel(resetHour)}`;
      }, 3000);
    }

    function loadResetTime() {
      let resetHour = localStorage.getItem('heater-reset-hour');

      if (resetHour === null) {
        resetHour = 5; // Default to 5:00 AM
        localStorage.setItem('heater-reset-hour', resetHour);
      } else {
        resetHour = parseInt(resetHour);
      }

      // Set select value
      const select = document.getElementById('resetHourSelect');
      if (select) {
        select.value = resetHour;
      }

      // Update display
      updateResetTimeDisplay(resetHour);

      // Sync with Firebase
      if (db) {
        db.ref('settings/resetHour').on('value', function(snapshot) {
          const firebaseResetHour = snapshot.val();
          if (firebaseResetHour !== null && firebaseResetHour !== resetHour) {
            localStorage.setItem('heater-reset-hour', firebaseResetHour);
            if (select) {
              select.value = firebaseResetHour;
            }
            updateResetTimeDisplay(firebaseResetHour);
            log(`自動リセット時刻を同期: ${getTimeLabel(firebaseResetHour)}`, 'info');
          }
        });
      }
    }

    function updateResetTimeDisplay(hour) {
      const status = document.getElementById('resetTimeStatus');
      if (status) {
        status.textContent = `現在の設定: ${getTimeLabel(hour)}`;
      }
    }

    function getTimeLabel(hour) {
      if (hour === 0) return 'AM 0:00 (深夜)';
      if (hour < 12) return `AM ${hour}:00`;
      if (hour === 12) return 'PM 12:00 (正午)';
      return `PM ${hour - 12}:00`;
    }

    // ============================================
    // Password Change Functions
    // ============================================

    async function changeAppPassword() {
      const currentPasswordInput = document.getElementById('currentPassword');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const statusElement = document.getElementById('passwordChangeStatus');

      const currentPassword = currentPasswordInput.value.trim();
      const newPassword = newPasswordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      // バリデーション
      if (!currentPassword) {
        statusElement.style.color = 'var(--primary-red)';
        statusElement.textContent = '❌ 現在のパスワードを入力してください';
        return;
      }

      if (!newPassword) {
        statusElement.style.color = 'var(--primary-red)';
        statusElement.textContent = '❌ 新しいパスワードを入力してください';
        return;
      }

      if (newPassword.length < 4) {
        statusElement.style.color = 'var(--primary-red)';
        statusElement.textContent = '❌ 新しいパスワードは4文字以上で設定してください';
        return;
      }

      if (newPassword !== confirmPassword) {
        statusElement.style.color = 'var(--primary-red)';
        statusElement.textContent = '❌ 新しいパスワードが一致しません';
        return;
      }

      // パスワード変更を実行
      statusElement.style.color = 'var(--gray-600)';
      statusElement.textContent = '🔄 変更中...';

      try {
        const result = await window.heaterAuth.changePassword(currentPassword, newPassword);

        if (result.success) {
          // Firebaseにも保存
          const newHash = await window.heaterAuth.hashPassword(newPassword);
          if (db) {
            await db.ref('settings/customPasswordHash').set(newHash);
          }

          statusElement.style.color = 'var(--primary-green)';
          statusElement.textContent = '✅ パスワードを変更しました';
          log('パスワードを変更しました', 'success');

          // フィールドをクリア
          currentPasswordInput.value = '';
          newPasswordInput.value = '';
          confirmPasswordInput.value = '';

          setTimeout(() => {
            statusElement.style.color = 'var(--gray-600)';
            statusElement.textContent = 'カスタムパスワード設定済み';
          }, 5000);
        } else {
          statusElement.style.color = 'var(--primary-red)';
          statusElement.textContent = '❌ ' + result.error;
          log('パスワード変更失敗: ' + result.error, 'error');
        }
      } catch (error) {
        statusElement.style.color = 'var(--primary-red)';
        statusElement.textContent = '❌ エラーが発生しました';
        log('パスワード変更エラー: ' + error, 'error');
      }
    }

    function loadPasswordStatus() {
      const statusElement = document.getElementById('passwordChangeStatus');
      const customPasswordHash = localStorage.getItem('heater-custom-password-hash');

      if (customPasswordHash) {
        statusElement.textContent = 'カスタムパスワード設定済み';
      } else {
        statusElement.textContent = 'デフォルトパスワード: hmt1541';
      }

      // Firebaseからパスワードハッシュを同期
      if (db) {
        db.ref('settings/customPasswordHash').on('value', function(snapshot) {
          const firebasePasswordHash = snapshot.val();
          if (firebasePasswordHash) {
            const currentHash = localStorage.getItem('heater-custom-password-hash');
            if (currentHash !== firebasePasswordHash) {
              localStorage.setItem('heater-custom-password-hash', firebasePasswordHash);
              statusElement.textContent = 'カスタムパスワード設定済み';
              log('パスワード設定を同期しました', 'info');
            }
          }
        });
      }
    }

    // ============================================
    // Activity Timeline
    // ============================================
    let currentFilter = 'all';
    let lastActivityCount = 0;

    function getActivityIcon(type) {
      const icons = {
        'add': '➕',
        'reuse': '🔄',
        'delete': '🗑️',
        'check': '✅',
        'uncheck': '⬜',
        'reset': '🔃',
        'final-check': '🎯'
      };
      return icons[type] || '📌';
    }

    function getActivityText(activity) {
      const typeText = {
        'add': '社員を追加',
        'reuse': '社員を再使用',
        'delete': '社員を削除',
        'check': '確認をチェック',
        'uncheck': '確認を解除',
        'reset': 'リセット実行',
        'final-check': '最終確認'
      };
      return typeText[activity.type] || '操作';
    }

    function formatRelativeTime(timestamp) {
      const time = new Date(timestamp);
      const year = time.getFullYear();
      const month = String(time.getMonth() + 1).padStart(2, '0');
      const day = String(time.getDate()).padStart(2, '0');
      const hours = String(time.getHours()).padStart(2, '0');
      const minutes = String(time.getMinutes()).padStart(2, '0');

      return `${year}.${month}.${day} ${hours}:${minutes}`;
    }

    function renderTimeline(filter = 'all') {
      currentFilter = filter;
      const container = document.getElementById('timelineContainer');
      const history = JSON.parse(localStorage.getItem('heater-activity-history') || '[]');

      console.log(`🎯 renderTimeline called: filter=${filter}, history count=${history.length}`);

      // Update filter buttons based on currentFilter
      const filterButtons = document.querySelectorAll('.filter-btn');
      filterButtons.forEach((btn, index) => {
        btn.classList.remove('active');
        const btnFilterType = btn.textContent.trim();
        const filterMap = {
          '全て': 'all',
          '追加': 'add',
          '再使用': 'reuse',
          '削除': 'delete',
          'チェック': 'check',
          '最終確認': 'final-check',
          'リセット': 'reset'
        };
        if (filterMap[btnFilterType] === currentFilter) {
          btn.classList.add('active');
        }
      });

      // Filter activities
      let filteredHistory = history;
      if (filter !== 'all') {
        filteredHistory = history.filter(activity => {
          if (filter === 'check') {
            return activity.type === 'check' || activity.type === 'uncheck';
          }
          return activity.type === filter;
        });
      }

      console.log(`📊 Filtered history: ${filteredHistory.length} items`);

      if (filteredHistory.length === 0) {
        console.log('⚠️ No items to display');
        container.innerHTML = `
          <div class="timeline-empty">
            <div style="font-size: 48px; margin-bottom: 12px;">📭</div>
            <div>${filter === 'all' ? 'アクティビティ履歴がありません' : 'フィルタに一致する履歴がありません'}</div>
          </div>
        `;
        return;
      }

      console.log('✅ Rendering timeline items...');

      let html = '';
      for (const activity of filteredHistory) {
        const icon = getActivityIcon(activity.type);
        const actionText = getActivityText(activity);
        const relativeTime = formatRelativeTime(activity.timestamp);

        // Determine if this is a check/uncheck action
        const isCheckAction = activity.type === 'check' || activity.type === 'uncheck';

        // 最終確認の結果表示
        let finalCheckResult = '';
        if (activity.type === 'final-check' && activity.additionalInfo) {
          const info = activity.additionalInfo;
          if (info.success) {
            finalCheckResult = `
              <div class="timeline-employee" style="color: var(--success-green); font-weight: 600;">
                ✅ 完了 - ${info.totalCount}名全員確認済み
              </div>
            `;
          } else {
            finalCheckResult = `
              <div class="timeline-employee" style="color: var(--primary-red); font-weight: 600;">
                ⚠️ 未完了 - ${info.uncheckedCount}名未確認 (確認済み: ${info.checkedCount}/${info.totalCount}名)
              </div>
            `;
            if (info.uncheckedNames && info.uncheckedNames.length > 0) {
              finalCheckResult += `
                <div style="font-size: 12px; color: var(--gray-600); margin-top: 4px;">
                  未確認: ${info.uncheckedNames.join(', ')}
                </div>
              `;
            }
          }
        }

        html += `
          <div class="timeline-item">
            <div class="timeline-icon type-${activity.type}">
              ${icon}
            </div>
            <div class="timeline-content">
              <div class="timeline-header">
                <span class="timeline-action">${actionText}</span>
                <span class="timeline-factory">@${activity.factoryName || factoryNames[activity.factory]}</span>
                ${activity.employeeType ? `<span class="timeline-badge ${activity.employeeType}">${activity.employeeType === 'permanent' ? '追加' : '再使用'}</span>` : ''}
              </div>
              ${activity.employeeName ? `<div class="timeline-employee">${activity.employeeName}</div>` : ''}
              ${activity.additionalInfo && activity.additionalInfo.count ? `<div class="timeline-employee">${activity.additionalInfo.count}名</div>` : ''}
              ${finalCheckResult}
              <div class="timeline-timestamp">${relativeTime}</div>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
      lastActivityCount = history.length;
      console.log(`✨ Timeline rendered successfully: ${filteredHistory.length} items displayed`);
    }

    function filterTimeline(type) {
      renderTimeline(type);
    }

    async function checkForNewActivities() {
      const history = JSON.parse(localStorage.getItem('heater-activity-history') || '[]');
      if (history.length !== lastActivityCount) {
        console.log(`📱 新しいアクティビティを検出: ${lastActivityCount} → ${history.length}`);
        log(`新しいアクティビティ: ${history.length - lastActivityCount}件追加`);

        // ダッシュボード全体を更新（統計カードも更新）
        await refreshDashboard();
      }
    }

    function startRealtimeUpdates() {
      // 初期カウントを設定
      const initialHistory = JSON.parse(localStorage.getItem('heater-activity-history') || '[]');
      lastActivityCount = initialHistory.length;
      console.log(`📊 初期アクティビティ数: ${lastActivityCount}`);

      // 500ミリ秒（0.5秒）ごとにアクティビティをチェック
      setInterval(checkForNewActivities, 500);

      // localStorage変更時に即座に反映（別タブ/ウィンドウからの変更を検知）
      window.addEventListener('storage', async function(e) {
        if (e.key === 'heater-activity-history' || e.key && e.key.startsWith('heater-employees-')) {
          console.log('📱 storage event detected:', e.key);
          await refreshDashboard();
          log('データ変更を検出しました（storage event）');
        }
      });

      // 同一ページ内の変更も検知（カスタムイベント）
      window.addEventListener('activityUpdated', async function() {
        console.log('📱 activityUpdated event detected');
        await refreshDashboard();
      });

      window.addEventListener('dataUpdated', async function() {
        console.log('📱 dataUpdated event detected');
        await refreshDashboard();
      });

      log('リアルタイム更新を開始しました（即時反映 + 0.5秒間隔チェック）');
    }

    // ============================================
    // Initialize
    // ============================================
    window.addEventListener('load', async () => {
      log('管理画面を起動しました');

      // Firebase初期化
      if (typeof initFirebase === 'function') {
        try {
          initFirebase();
          if (typeof getDatabase === 'function') {
            db = getDatabase();
            updateStatus('Firebase接続成功', true);
            log('Firebase初期化完了', 'success');
          }
        } catch (e) {
          updateStatus('ローカルモード', false);
          log('Firebase接続失敗 - ローカルモードで動作', 'warning');
        }
      } else {
        updateStatus('ローカルモード', false);
        log('Firebase未設定 - ローカルモードで動作', 'warning');
      }

      // ダッシュボード初期化
      await refreshDashboard();

      // リセット時刻設定をロード
      loadResetTime();

      // パスワード状態をロード
      loadPasswordStatus();

      // リアルタイム更新を開始
      startRealtimeUpdates();

      log('システム準備完了', 'success');
    });

    // Service Worker Registration with Auto-Update
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(function(registration) {
          console.log('✅ Service Worker registered:', registration.scope);

          // 更新をチェック
          registration.update();

          // 新しいService Workerが待機中の場合、自動的にアクティブ化してリロード
          if (registration.waiting) {
            console.log('🔄 新しいバージョンを適用中...');
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          }

          // 新しいService Workerがインストールされたら通知
          registration.addEventListener('updatefound', function() {
            var newWorker = registration.installing;
            console.log('📥 新しいバージョンをダウンロード中...');

            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // 新しいバージョンがインストールされた
                console.log('✨ 新しいバージョンが利用可能です。リロードします...');
                newWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        })
        .catch(function(error) {
          console.log('❌ Service Worker登録失敗:', error);
        });

      // Service Workerが更新されてアクティブになったらページをリロード
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!refreshing) {
          refreshing = true;
          console.log('🔄 ページを更新して最新版を表示します...');
          window.location.reload();
        }
      });
    }
  </script>
</body>
</html>
